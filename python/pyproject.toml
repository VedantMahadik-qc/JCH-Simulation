[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jch"
version = "0.1.0"
description = "Simulation toolkit for the Jaynes-Cummings-Hubbard model (QuTiP backend)"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vedant Mahadik" }]
keywords = ["quantum-optics", "jaynes-cummings", "cavity-qed", "qutip"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "qutip>=5.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]
notebooks = ["jupyter", "ipykernel", "imageio", "tqdm"]

[project.scripts]
jch-benchmark = "jch.benchmarks:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
